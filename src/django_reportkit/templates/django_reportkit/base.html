{% load i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% trans "Report" %}{% endblock %}</title>
    <style>
        body { margin: 0; padding: 24px; background: #f1f5f9; color: #172033; font-family: "Inter", "Noto Sans Arabic", Arial, sans-serif; font-size: 14px; }
        .rk-shell { max-width: 1100px; margin: 0 auto; }
        .rk-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .rk-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; justify-content: space-between; }
        .rk-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
        .rk-filters label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .rk-filters .errorlist { color: #dc2626; margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; }
        .rk-button { display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #172033; text-decoration: none; cursor: pointer; font: inherit; }
        .rk-button--primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .rk-frame { width: 100%; height: 75vh; border: 0; border-radius: 10px; background: #fff; }
        .rk-pages { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; }
        .rk-message { padding: 12px 14px; border-radius: 8px; background: #fef2f2; color: #991b1b; }
        .rk-muted { color: #64748b; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <main class="rk-shell">{% block content %}{% endblock %}</main>
</body>
</html>
