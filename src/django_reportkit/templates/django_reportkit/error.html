{% extends "django_reportkit/base.html" %}
{% load i18n %}
{% block title %}{% trans "Report" %}{% endblock %}
{% block content %}
<section class="rk-panel">
    <p class="rk-message">{{ message }}</p>
    {% if back_url %}<p><a class="rk-button" href="{{ back_url }}">{% trans "Back" %}</a></p>{% endif %}
</section>
{% endblock %}
